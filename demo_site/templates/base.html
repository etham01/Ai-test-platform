<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}DemoShop{% endblock %} · DemoShop</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/" aria-label="DemoShop 首页">
          <span class="brand-mark">D</span>
          <span>DemoShop</span>
        </a>
        <nav class="main-nav" aria-label="主导航">
          <a href="/">首页</a>
          <a href="/products">商品列表</a>
          <a href="/cart">购物车{% if cart_count %} ({{ cart_count }}){% endif %}</a>
          <a href="/about">关于</a>
        </nav>
        <div class="account-nav">
          {% if user %}
            <span class="muted">你好，{{ user.display_name }}</span>
            <a href="/logout">退出</a>
          {% else %}
            <a href="/login">登录</a>
          {% endif %}
        </div>
      </div>
    </header>

    <main class="container page">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">
        DemoShop 本地测试站点 · 仅用于 SmartTest 演示 · 数据为固定测试数据
      </div>
    </footer>
  </body>
</html>
